name: Deploy landing site

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run landing build
      - name: Prepare subscriber storage
        working-directory: websites/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBSCRIBE_GOOGLE_FORM_ACTION: ${{ secrets.SUBSCRIBE_GOOGLE_FORM_ACTION }}
          SUBSCRIBE_GOOGLE_EMAIL_ENTRY: ${{ secrets.SUBSCRIBE_GOOGLE_EMAIL_ENTRY }}
          SUBSCRIBE_GOOGLE_SHEET_URL: ${{ secrets.SUBSCRIBE_GOOGLE_SHEET_URL }}
          SUBSCRIBE_SHEET_WEBHOOK: ${{ secrets.SUBSCRIBE_SHEET_WEBHOOK }}
        run: bun scripts/ensure-kv.ts
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: websites/landing
          packageManager: bun
          command: pages deploy dist --project-name=ethcm --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
